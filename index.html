<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>환성연 MT 레크리에이션</title><link rel="stylesheet" href="style.css?v=20260731-2"></head><body>
<main id="deck" aria-label="환성연 MT 레크리에이션"><img id="slide" alt="환성연 MT 레크리에이션 슬라이드"></main>
<aside id="scoreboard" class="closed"><button id="score-toggle" title="점수판 열기">점수 · 순위</button><div id="score-body"><div class="side-head"><b>실시간 점수</b><button id="reset" class="text-btn">초기화</button></div><div id="scores"></div><div id="ranking"></div><button id="score-edit">점수 입력 / 수정</button></div></aside>
<section id="timer-box" class="closed"><div id="timer">00:45</div><div><button id="timer-start">시작</button><button id="timer-pause">일시정지</button><button id="timer-reset">초기화</button></div></section>
<div id="controls"><button id="prev" title="이전 슬라이드">←</button><span id="count"></span><button id="next" title="다음 슬라이드">→</button><button id="fullscreen" title="전체화면">⛶</button></div>
<dialog id="score-dialog"><form method="dialog"><div class="dialog-head"><h2>점수 입력</h2><button class="close" value="cancel">×</button></div><p>현재 슬라이드: <b id="context"></b></p><div id="inputs"></div><div class="dialog-actions"><button type="button" id="mission-award">비밀미션 점수 반영</button><button type="button" id="save-scores">저장</button></div></form></dialog>
<script src="app.js?v=20260731-2"></script></body></html>
